{% extends "admin/base.html" %}{% block content %}<div class="admin-header"><div><span class="section-index">THE CURRENT NOTE</span><h1>Promotions.</h1></div></div><div class="admin-split"><form class="studio-form form-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><h2>Add a promotion</h2><label>Title<input name="title" required></label><label>Body<textarea name="body" rows="4" required></textarea></label><label class="check"><input type="checkbox" name="enabled" checked> Show on homepage</label><button class="button button-dark">Save promotion ↗</button></form><div class="admin-table">{% for item in promotions %}<div class="admin-row simple"><div><strong>{{ item.title }}</strong><small>{{ 'Live' if item.enabled else 'Hidden' }}</small><p>{{ item.body }}</p></div><form method="post" action="{{ url_for('admin.promotion_delete', promotion_id=item.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="remove-button">×</button></form></div>{% endfor %}</div></div>{% endblock %}
