<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Studio dashboard{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body class="admin-body"><aside class="admin-sidebar"><a class="brand admin-brand" href="{{ url_for('main.home') }}"><span class="brand-mark">WG</span><span><strong>Wispers Glow</strong><small>STUDIO / ADMIN</small></span></a><nav><a href="{{ url_for('admin.dashboard') }}">Overview</a><a href="{{ url_for('admin.products') }}">Products</a><a href="{{ url_for('admin.testimonials') }}">Testimonials</a><a href="{{ url_for('admin.promotions') }}">Promotions</a><a href="{{ url_for('admin.homepage') }}">Homepage</a><a href="{{ url_for('admin.orders') }}">Orders</a></nav><a class="logout-link" href="{{ url_for('auth.logout') }}">Log out ↗</a></aside><main class="admin-main">{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="flash-stack">{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
