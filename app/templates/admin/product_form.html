{% extends "admin/base.html" %}{% block title %}{{ 'Edit' if product else 'Add' }} product — Studio{% endblock %}{% block content %}<div class="admin-header"><div><span class="section-index">THE CATALOGUE / {{ 'EDIT' if product else 'NEW' }}</span><h1>{{ 'Edit product.' if product else 'Add a ritual.' }}</h1></div></div><form class="studio-form" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-columns"><div><label>Product name<input name="name" value="{{ product.name if product else '' }}" required></label><div class="two-fields"><label>Price (₦)<input name="price" type="number" min="0" step="1" value="{{ product.price if product else '' }}" required></label><label>Stock<input name="stock" type="number" min="0" value="{{ product.stock if product else 0 }}" required></label></div><label>Short description<input name="short_description" value="{{ product.short_description if product else '' }}" required></label><label>Full description<textarea name="full_description" rows="5" required>{{ product.full_description if product else '' }}</textarea></label><label>Benefits <small>one per line</small><textarea name="benefits" rows="5">{% if product %}{{ product.benefit_list()|join('\n') }}{% endif %}</textarea></label><label>How to use<textarea name="how_to_use" rows="4">{{ product.how_to_use if product else '' }}</textarea></label></div><div class="form-card"><label>Main image<input type="file" name="main_image" accept=".jpg,.jpeg,.png,.webp">{% if product %}<small>Current: {{ product.main_image }}</small>{% endif %}</label><label>Before image<input type="file" name="before_image" accept=".jpg,.jpeg,.png,.webp"></label><label>After image<input type="file" name="after_image" accept=".jpg,.jpeg,.png,.webp"></label><label class="check"><input type="checkbox" name="featured" {% if product and product.featured %}checked{% endif %}> Featured in opening edit</label><label class="check"><input type="checkbox" name="published" {% if not product or product.published %}checked{% endif %}> Published on the site</label><hr><label class="check"><input type="checkbox" name="promotion_enabled" {% if product and product.promotion_enabled %}checked{% endif %}> Attach a gift note</label><label>Promotion text<input name="promotion_text" value="{{ product.promotion_text if product else '' }}"></label><label>Free gift<input name="free_gift" value="{{ product.free_gift if product else '' }}"></label><button class="button button-dark">Save product ↗</button></div></div></form>{% endblock %}
