<article class="product-card">
  <a class="product-visual" href="{{ url_for('main.product', slug=product.slug) }}">
    <img src="{{ url_for('static', filename=product.main_image) }}" alt="{{ product.name }}" draggable="false">
    {% if product.before_image and product.after_image %}<div class="card-comparison" role="group" aria-label="Before and after comparison"><img src="{{ url_for('static', filename=product.after_image) }}" alt="" draggable="false" /><div><img src="{{ url_for('static', filename=product.before_image) }}" alt="" draggable="false" /></div><button class="card-comparison-handle" type="button" aria-label="Drag to compare before and after"><span>↔</span></button></div>{% endif %}
    {% if product.promotion_enabled %}<span class="product-tag">Gift inside</span>{% elif product.featured %}<span class="product-tag">Featured</span>{% endif %}
    <span class="product-click-label">Click to view <span aria-hidden="true">↗</span></span>
  </a>
  <div class="product-info"><div class="product-kicker">Ritual {{ "%02d"|format(product.id) }}</div><h3><a href="{{ url_for('main.product', slug=product.slug) }}">{{ product.name }}</a></h3><p>{{ product.short_description }}</p><div class="product-row"><strong>{{ product.price|money }}</strong><form class="card-add-form" action="{{ url_for('main.add_to_cart', product_id=product.id) }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="quantity" value="1"><button class="card-add-button" type="submit">Add to bag <span aria-hidden="true">+</span></button></form></div></div>
</article>
