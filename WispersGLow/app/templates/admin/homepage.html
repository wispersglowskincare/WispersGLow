{% extends "admin/base.html" %}{% block content %}<div class="admin-header"><div><span class="section-index">THE FRONT DOOR</span><h1>Homepage.</h1><p>Change the words and images without touching the templates.</p></div></div><form class="studio-form" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-columns"><div><h2>Opening note</h2><label>Eyebrow<input name="hero_eyebrow" value="{{ settings.hero_eyebrow }}"></label><label>Hero title<input name="hero_title" value="{{ settings.hero_title }}"></label><label>Hero subtitle<textarea name="hero_subtitle" rows="4">{{ settings.hero_subtitle }}</textarea></label><label>Button text<input name="hero_button" value="{{ settings.hero_button }}"></label><label>Hero image<input type="file" name="hero_image" accept=".jpg,.jpeg,.png,.webp"></label><h2>Delivery</h2><label class="check"><input type="checkbox" name="delivery_enabled" {% if settings.delivery_enabled %}checked{% endif %}> Show delivery announcement</label><label>Announcement<input name="delivery_text" value="{{ settings.delivery_text }}"></label></div><div><h2>Comparison study</h2><label>Heading<input name="before_title" value="{{ settings.before_title }}"></label><label>Description<textarea name="before_description" rows="4">{{ settings.before_description }}</textarea></label><label>Before image<input type="file" name="before_image" accept=".jpg,.jpeg,.png,.webp"></label><label>After image<input type="file" name="after_image" accept=".jpg,.jpeg,.png,.webp"></label><h2>About & contact</h2><label>About title<input name="about_title" value="{{ settings.about_title }}"></label><label>About body<textarea name="about_body" rows="4">{{ settings.about_body }}</textarea></label><label>WhatsApp number<input name="whatsapp_number" value="{{ settings.whatsapp_number }}"></label></div></div><button class="button button-dark">Save homepage ↗</button></form>{% endblock %}
